<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫禁城 · 万里长城 | 3D 数字全景</title>
<style>
  :root{
    --cyan:#3fe1ff; --gold:#e8c06a;
    --panel:rgba(7,14,26,.78);
    --line:rgba(63,225,255,.28);
    --txt:#cfe6f2; --dim:#6f93a6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04070f;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--txt);
    -webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;z-index:0}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 38%, transparent 52%, rgba(2,6,12,.6) 100%)}
  #scanfx{position:fixed;inset:0;pointer-events:none;z-index:2;mix-blend-mode:screen;
    background:repeating-linear-gradient(0deg, rgba(63,225,255,.03) 0 1px, transparent 1px 3px)}

  .hud-tl{position:fixed;top:18px;left:22px;z-index:10;pointer-events:none}
  .hud-tl .logo{font-size:30px;font-weight:800;letter-spacing:9px;line-height:1.1;
    background:linear-gradient(92deg,#9fe6ff,#3fe1ff 42%,#e8c06a);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hud-tl .sub{margin-top:6px;font-size:10.5px;letter-spacing:4px;color:#67aec6}
  .hud-tl .meta{margin-top:9px;font-family:ui-monospace,Consolas,monospace;font-size:11px;
    color:#4f7186;letter-spacing:1px}
  .hud-tl .meta b{color:#e8c06a;font-weight:600}

  /* ── 世界切换 ── */
  #worldbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:6px;padding:6px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(10px)}
  .wbtn{background:transparent;border:1px solid transparent;color:#8fb9cb;padding:7px 18px;
    border-radius:999px;font-size:13.5px;letter-spacing:2px;cursor:pointer;transition:all .18s;font-family:inherit}
  .wbtn:hover{color:#dff6ff}
  .wbtn.on{background:rgba(63,225,255,.14);border-color:var(--cyan);color:#eaffff;
    box-shadow:0 0 14px rgba(63,225,255,.35)}

  .hud-tr{position:fixed;top:72px;right:20px;z-index:10;min-width:212px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;backdrop-filter:blur(8px);pointer-events:none;
    font-family:ui-monospace,Consolas,monospace;font-size:11px}
  .hud-tr .row{display:flex;justify-content:space-between;gap:16px;line-height:1.85;color:#7fb3c8}
  .hud-tr .row span:last-child{color:#d8f4ff}
  .hud-tr .row .ok{color:#48e8a8}

  #bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    max-width:94vw;padding:10px 14px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);
    box-shadow:0 10px 44px rgba(0,0,0,.5)}
  .btn{background:rgba(10,22,38,.6);border:1px solid var(--line);color:#bfe9f7;
    padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;letter-spacing:1px;
    backdrop-filter:blur(6px);transition:all .18s ease;font-family:inherit}
  .btn:hover{border-color:var(--cyan);color:#fff;box-shadow:0 0 12px rgba(63,225,255,.28)}
  .btn.on{background:rgba(63,225,255,.16);border-color:var(--cyan);color:#eaffff;
    box-shadow:0 0 14px rgba(63,225,255,.4)}
  .btn .k{opacity:.45;margin-left:6px;font:10px ui-monospace,Consolas,monospace}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}

  #tip{position:fixed;left:22px;bottom:20px;z-index:10;font-size:11px;color:#54788c;
    letter-spacing:1px;line-height:1.8;pointer-events:none}

  #pois{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
  .poi{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
    display:flex;align-items:center;transition:opacity .25s}
  .poi.hidden{opacity:0;pointer-events:none}
  .poi-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);flex:none;
    box-shadow:0 0 8px rgba(63,225,255,.9);animation:poiPulse 2.4s infinite}
  .poi-tag{margin-left:7px;font-size:11px;letter-spacing:2px;padding:3px 9px;white-space:nowrap;
    background:rgba(5,12,22,.74);border:1px solid var(--line);border-radius:4px;color:#d8f4ff;
    backdrop-filter:blur(4px)}
  .poi:hover .poi-tag{border-color:var(--cyan);color:#fff}
  .poi.active .poi-tag{border-color:var(--gold);color:var(--gold)}
  @keyframes poiPulse{0%{box-shadow:0 0 0 0 rgba(63,225,255,.55)}70%{box-shadow:0 0 0 12px rgba(63,225,255,0)}100%{box-shadow:0 0 0 0 rgba(63,225,255,0)}}
  #pois.dim .poi{opacity:0 !important;pointer-events:none}

  #card{position:fixed;top:120px;right:20px;z-index:11;width:336px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;backdrop-filter:blur(12px);
    box-shadow:0 14px 50px rgba(0,0,0,.55);
    opacity:0;transform:translateX(22px);pointer-events:none;transition:all .3s ease}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #card .head{display:flex;justify-content:space-between;align-items:flex-start}
  #card .name{font-size:21px;font-weight:700;color:#fff;letter-spacing:3px}
  #card .en{font-size:10.5px;letter-spacing:1.5px;color:var(--cyan);margin-top:4px;
    font-family:ui-monospace,Consolas,monospace}
  #card .close{cursor:pointer;color:#54788c;font-size:18px;line-height:1;padding:2px 6px;
    border:1px solid transparent;border-radius:6px}
  #card .close:hover{color:#fff;border-color:var(--line)}
  #card .year{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:1px;
    color:var(--gold);border:1px solid rgba(232,192,106,.4);padding:3px 10px;border-radius:999px}
  #card .desc{margin-top:12px;font-size:13px;line-height:1.8;color:#b9d4e2;text-align:justify}
  #card .inner-btn{margin-top:14px;display:inline-block;font-size:12px;letter-spacing:2px;
    color:#0a1522;background:linear-gradient(92deg,#57e6ff,#3fc4ff);padding:7px 16px;
    border-radius:999px;cursor:pointer;font-weight:600}
  #card .inner-btn:hover{box-shadow:0 0 16px rgba(63,225,255,.6)}
  #card .geo{margin-top:14px;padding-top:10px;border-top:1px dashed rgba(63,225,255,.18);
    font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#4f7186;letter-spacing:1px}

  #loader{position:fixed;inset:0;z-index:99;background:#04070f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .8s ease}
  #loader.done{opacity:0;pointer-events:none}
  #loader .t1{font-size:36px;font-weight:800;letter-spacing:14px;text-indent:14px;
    background:linear-gradient(92deg,#9fe6ff,#3fe1ff 45%,#e8c06a);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #loader .t2{font-size:11px;letter-spacing:5px;color:#4f7186;
    font-family:ui-monospace,Consolas,monospace}
  #loader .bar{width:280px;height:2px;background:rgba(63,225,255,.14);border-radius:2px;overflow:hidden}
  #loader .fill{height:100%;width:0;background:linear-gradient(90deg,#1b9cc4,#3fe1ff);
    box-shadow:0 0 12px rgba(63,225,255,.8);transition:width .25s ease}
  #loader .msg{font-size:11px;color:#54788c;letter-spacing:2px}

  @media (max-width:900px){
    .hud-tr{display:none}
    .hud-tl .logo{font-size:22px;letter-spacing:5px}
    #worldbar{top:auto;bottom:78px}
    #card{left:12px;right:12px;width:auto;top:auto;bottom:132px}
    #tip{display:none}
    .btn{padding:6px 10px;font-size:11.5px}
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scanfx"></div>

<div class="hud-tl">
  <div class="logo" id="logo">紫禁城</div>
  <div class="sub" id="sub">FORBIDDEN CITY · 3D DIGITAL TWIN</div>
  <div class="meta">EST. <b>1420</b> · 北京中轴线 · 数字孪生 · THREE.JS 实时渲染</div>
</div>

<div id="worldbar">
  <button class="wbtn on" data-world="gugong">🏯 紫禁城</button>
  <button class="wbtn" data-world="wall">🏔 万里长城</button>
</div>

<div class="hud-tr" id="stats">
  <div class="row"><span>FPS</span><span id="st-fps">--</span></div>
  <div class="row"><span>TRIANGLES</span><span id="st-tri">--</span></div>
  <div class="row"><span>DRAW CALLS</span><span id="st-call">--</span></div>
  <div class="row"><span>CAM</span><span id="st-cam">--</span></div>
  <div class="row"><span>RENDER</span><span class="ok">WEBGL · ONLINE</span></div>
</div>

<div id="pois"></div>

<div id="card">
  <div class="head">
    <div><div class="name" id="c-name"></div><div class="en" id="c-en"></div></div>
    <div class="close" id="c-close">✕</div>
  </div>
  <div class="year" id="c-year"></div>
  <div class="desc" id="c-desc"></div>
  <div id="c-inner" class="inner-btn" style="display:none">◎ 进入殿内 · 内景视角</div>
  <div class="geo" id="c-geo"></div>
</div>

<div id="bar">
  <span id="viewbtns" style="display:contents"></span>
  <div class="sep"></div>
  <button class="btn" data-toggle="tour">巡航<span class="k">␣</span></button>
  <button class="btn" data-toggle="rotate">旋转<span class="k">R</span></button>
  <button class="btn on" data-toggle="shadow">光影</button>
  <button class="btn on" data-toggle="scan">扫描</button>
  <button class="btn" data-toggle="xray">线框<span class="k">X</span></button>
  <button class="btn on" data-toggle="labels">标注<span class="k">L</span></button>
</div>

<div id="tip">左键拖拽 旋转 · 滚轮 缩放 · 右键 平移 · 点击建筑/标注 查看详情<br>空格 巡航 · 数字键 切换机位 · X 线框 · 进入大殿可看金砖藻井宝座</div>

<div id="loader">
  <div class="t1">紫禁城 · 长城</div>
  <div class="t2">CHINA HERITAGE DIGITAL TWIN</div>
  <div class="bar"><div class="fill" id="ld-fill"></div></div>
  <div class="msg" id="ld-msg">正在构建数字紫禁城与万里长城…</div>
</div>

<script>
  window.__errs=[];
  window.addEventListener('error',function(e){window.__errs.push(String(e.message||e));});
  window.addEventListener('unhandledrejection',function(e){window.__errs.push('rejection: '+String(e.reason));});
  setTimeout(function(){
    if(!window.__APP_READY__){
      var m=document.getElementById('ld-msg');
      if(m) m.textContent='资源加载超时：Three.js 需联网加载（registry.npmmirror.com），请检查网络后刷新';
    }
  },12000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://registry.npmmirror.com/three/0.170.0/files/build/three.module.js",
    "three/addons/": "https://registry.npmmirror.com/three/0.170.0/files/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ═══════════ 渲染器 / 场景 / 相机 ═══════════ */
let renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true}); }
catch(e){
  document.getElementById('ld-msg').textContent='当前环境不支持 WebGL，无法渲染 3D 场景';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.info.autoReset=false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070f);
scene.fog = new THREE.Fog(0x04070f, 520, 3400);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .4, 8000);
camera.position.set(0, 640, 1180);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 3; controls.maxDistance = 2200;
controls.maxPolarAngle = 1.53; controls.minPolarAngle = .03;
controls.autoRotateSpeed = .55;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .75, .38, .8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

/* ═══════════ 灯光 ═══════════ */
scene.add(new THREE.HemisphereLight(0x7fb2e8, 0x0b0f1a, .6));
scene.add(new THREE.AmbientLight(0x1c2740, .5));
const sun = new THREE.DirectionalLight(0xffe8c0, 1.35); sun.position.set(340,460,260); scene.add(sun);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-640; sun.shadow.camera.right=640;
sun.shadow.camera.top=660;  sun.shadow.camera.bottom=-660;
sun.shadow.camera.near=60;  sun.shadow.camera.far=1700;
sun.shadow.bias=-0.0006; sun.shadow.normalBias=.8;
const fill = new THREE.DirectionalLight(0x9fd0ff, .55); fill.position.set(60,160,-520); scene.add(fill);
const rim = new THREE.DirectionalLight(0x3fd8ff, .32);  rim.position.set(-380,300,-360); scene.add(rim);

/* ═══════════ 程序化纹理工厂（每一块砖 / 每一片瓦都由此生成） ═══════════ */
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
// 城砖（红色宫墙砖）
const texBrick=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#5a1219'; g.fillRect(0,0,w,h);
  const bh=32,bw=64;
  for(let y=0;y<h/bh;y++){
    const off=(y%2)*bw/2;
    for(let x=-1;x<w/bw+1;x++){
      const l=.82+Math.random()*.34;
      g.fillStyle=`rgb(${(150*l)|0},${(36*l)|0},${(46*l)|0})`;
      g.fillRect(x*bw+off+1,y*bh+1,bw-2,bh-2);
      g.fillStyle='rgba(255,215,175,.06)'; g.fillRect(x*bw+off+1,y*bh+1,bw-2,2);
    }
  }
});
// 灰砖（长城）
const texGWBrick=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#3d4349'; g.fillRect(0,0,w,h);
  const bh=32,bw=64;
  for(let y=0;y<h/bh;y++){
    const off=(y%2)*bw/2;
    for(let x=-1;x<w/bw+1;x++){
      const l=.8+Math.random()*.36;
      g.fillStyle=`rgb(${(118*l)|0},${(126*l)|0},${(134*l)|0})`;
      g.fillRect(x*bw+off+1,y*bh+1,bw-2,bh-2);
      g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x*bw+off+1,y*bh+1,bw-2,2);
    }
  }
});
// 汉白玉石条
const texStone=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#8f979e'; g.fillRect(0,0,w,h);
  const bh=42;
  for(let y=0;y<h/bh;y++){
    const off=(y%2)*53;
    for(let x=-1;x<w/106+2;x++){
      const l=.88+Math.random()*.22;
      g.fillStyle=`rgb(${(186*l)|0},${(192*l)|0},${(198*l)|0})`;
      g.fillRect(x*106+off+1,y*bh+1,104,bh-2);
      g.fillStyle='rgba(30,40,50,.25)'; g.fillRect(x*106+off+1,y*bh+bh-3,104,2);
    }
  }
});
// 金砖墁地（室内地面）
const texFloor=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#191f26'; g.fillRect(0,0,w,h);
  const s=64;
  for(let y=0;y<h/s;y++)for(let x=0;x<w/s;x++){
    const l=.82+Math.random()*.34;
    g.fillStyle=`rgb(${(64*l)|0},${(70*l)|0},${(78*l)|0})`;
    g.fillRect(x*s+2,y*s+2,s-4,s-4);
    g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(x*s+2,y*s+2,s-4,2);
    g.fillStyle='rgba(0,0,0,.22)'; g.fillRect(x*s+2,y*s+s-5,s-4,3);
  }
});
// 琉璃瓦（每行筒瓦一片片清晰可见）
const texRoof=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#6b5220'; g.fillRect(0,0,w,h);
  const rh=32;
  for(let y=0;y<h/rh+1;y++){
    const off=(y%2)*16;
    for(let x=-1;x<w/32+2;x++){
      const l=.8+Math.random()*.38;
      const grd=g.createLinearGradient(0,y*rh,0,y*rh+rh);
      grd.addColorStop(0,`rgb(${(214*l)|0},${(172*l)|0},${(92*l)|0})`);
      grd.addColorStop(.62,`rgb(${(166*l)|0},${(128*l)|0},${(58*l)|0})`);
      grd.addColorStop(1,`rgb(${(104*l)|0},${(78*l)|0},${(34*l)|0})`);
      g.fillStyle=grd;
      g.beginPath(); g.arc(x*32+off+16,y*rh+rh,16,Math.PI,0); g.fill();
    }
    g.fillStyle='rgba(35,22,4,.6)'; g.fillRect(0,y*rh+rh-3,w,3);
  }
});
// 灰瓦（长城城楼）
const texRoofG=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#343b42'; g.fillRect(0,0,w,h);
  const rh=32;
  for(let y=0;y<h/rh+1;y++){
    const off=(y%2)*16;
    for(let x=-1;x<w/32+2;x++){
      const l=.8+Math.random()*.34;
      const grd=g.createLinearGradient(0,y*rh,0,y*rh+rh);
      grd.addColorStop(0,`rgb(${(128*l)|0},${(138*l)|0},${(148*l)|0})`);
      grd.addColorStop(.65,`rgb(${(88*l)|0},${(96*l)|0},${(104*l)|0})`);
      grd.addColorStop(1,`rgb(${(54*l)|0},${(60*l)|0},${(66*l)|0})`);
      g.fillStyle=grd;
      g.beginPath(); g.arc(x*32+off+16,y*rh+rh,16,Math.PI,0); g.fill();
    }
    g.fillStyle='rgba(10,14,18,.6)'; g.fillRect(0,y*rh+rh-3,w,3);
  }
});
// 门钉金钉红门
const texDoorStud=canvasTex(256,384,(g,w,h)=>{
  g.fillStyle='#8a1a20'; g.fillRect(0,0,w,h);
  g.strokeStyle='#530d12'; g.lineWidth=4;
  for(let x=0;x<=w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
  for(let y=0;y<=h;y+=96){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  for(let y=48;y<h;y+=96)for(let x=32;x<w;x+=64){
    const r=g.createRadialGradient(x-3,y-3,1,x,y,9);
    r.addColorStop(0,'#ffe9a8'); r.addColorStop(.5,'#c99a3d'); r.addColorStop(1,'#7a5a1c');
    g.fillStyle=r; g.beginPath(); g.arc(x,y,8,0,7); g.fill();
  }
});
// "正大光明"匾
const texPlaque=canvasTex(512,128,(g,w,h)=>{
  g.fillStyle='#38151c'; g.fillRect(0,0,w,h);
  g.strokeStyle='#e8c06a'; g.lineWidth=6; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#f2d488'; g.font='bold 78px KaiTi,"楷体",STKaiti,serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('正 大 光 明',w/2,h/2+6);
});
// 井字天花彩画（贴金团龙藻井心）
const texCoffer=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#0f2f38'; g.fillRect(0,0,w,h);
  const s=128;

function rep(tex,rx,ry){

/* ═══════════ 几何工具（含 UV，让砖瓦纹理落地） ═══════════ */
function edged(mesh){
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,28),edgeMat);
  mesh.add(e); return mesh;
}
function sh(m){ m.castShadow=true; m.receiveShadow=true; return m; }
function box(parent,w,h,d,x,y,z,m,edge=true){
  const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  g.position.set(x,y,z);
  g.castShadow=true; g.receiveShadow=true;
  parent.add(g); if(edge)edged(g); return g;
}
function hipRoofGeo(w,d,h,ridge=.58){
  const a=w/2,b=d/2,rw=a*ridge,pos=[],uv=[];
  const A=[-a,0,b],B=[a,0,b],C=[a,0,-b],D=[-a,0,-b],P1=[-rw,h,0],P2=[rw,h,0];
  const tri=(p,q,r)=>{pos.push(...p,...q,...r);
    uv.push(p[0]/5,p[2]/5,q[0]/5,q[2]/5,r[0]/5,r[2]/5);};
  tri(A,B,P2); tri(A,P2,P1); tri(C,D,P1); tri(C,P1,P2); tri(D,A,P1); tri(B,C,P2);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals(); return g;
}
function hipFrustumGeo(w1,d1,w2,d2,h){
  const a1=w1/2,b1=d1/2,a2=w2/2,b2=d2/2,pos=[],uv=[];
  const B=[[-a1,0,b1],[a1,0,b1],[a1,0,-b1],[-a1,0,-b1]];
  const T=[[-a2,h,b2],[a2,h,b2],[a2,h,-b2],[-a2,h,-b2]];
  const q=(p,r,s,t)=>{pos.push(...p,...r,...s,...p,...s,...t);
    uv.push(p[0]/5,p[2]/5,r[0]/5,r[2]/5,s[0]/5,s[2]/5,p[0]/5,p[2]/5,s[0]/5,s[2]/5,t[0]/5,t[2]/5);};
  q(B[0],B[1],T[1],T[0]); q(B[2],B[3],T[3],T[2]); q(B[3],B[0],T[0],T[3]); q(B[1],B[2],T[2],T[1]);
  q(T[0],T[1],T[2],T[3]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals(); return g;
}
function pyramidGeo(w,d,h){
  const a=w/2,b=d/2,pos=[],uv=[];
  const A=[-a,0,b],B=[a,0,b],C=[a,0,-b],D=[-a,0,-b],T=[0,h,0];
  const tri=(p,q,r)=>{pos.push(...p,...q,...r);
    uv.push(p[0]/5,p[2]/5,q[0]/5,q[2]/5,r[0]/5,r[2]/5);};
  tri(A,B,T); tri(B,C,T); tri(C,D,T); tri(D,A,T);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals(); return g;
}
function roundedPath(t,w,h,r){
  const x=-w/2,y=-h/2;
  t.moveTo(x+r,y); t.lineTo(x+w-r,y); t.quadraticCurveTo(x+w,y,x+w,y+r);
  t.lineTo(x+w,y+h-r); t.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  t.lineTo(x+r,y+h); t.quadraticCurveTo(x,y+h,x,y+h-r);
  t.lineTo(x,y+r); t.quadraticCurveTo(x,y,x+r,y); return t;
}
function roundedShape(w,h,r){ return roundedPath(new THREE.Shape(),w,h,r); }

function stairs(parent,wdt,topY,zEdge){

function colRing(parent,w,d,topY,bodyH){

// 彩画枋 + 斗拱（檐下每朵斗拱都可见）
function eaveDecor(parent,w,d,y,dougong){

function balustrade(parent,w,d,y){

  for(let j=1;j<nz;j++){const z=-d/2+j*d/nz; per.push([-w/2,z,Math.PI/2],[w/2,z,Math.PI/2]);}
  const im=new THREE.InstancedMesh(post,matMarble,per.length);

  const zj3=new THREE.Mesh(new THREE.CylinderGeometry(1.9,2.6,1,24),matGoldDark); zj3.position.set(0,topY+bodyH-2.6,zjz); g.add(zj3);
  const zz=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.35,.28,20),matThroneGold);

// 宫殿生成器
function palace(o){
  const {w,d,bodyH=10,tiers=1,double=false,pyr=false,roofH=8,x=0,y=0,z=0}=o;
  const g=new THREE.Group(); g.position.set(x,y,z);
  const bm=o.bm||matWall, rm=o.rm||matGold;
  for(let i=0;i<tiers;i++){
    const tw=w+8+(tiers-1-i)*9, td=d+8+(tiers-1-i)*9;
    box(g,tw,3,td, 0,i*3+1.5,0, tiers>=2&&i===tiers-1?matMarbleBig:matMarble);
  }
  const topY=tiers*3;
  if(tiers>0) stairs(g,w*.42,topY,-(d+8+(tiers-1)*9)/2);
  if(o.interior){
    interior(g,{...o,topY,bm},topY);
  }else{
    box(g,w,bodyH,d, 0,topY+bodyH/2,0, bm);
    colRing(g,w,d,topY,bodyH);
    doors(g,w,d,topY,bodyH);
  }
  eaveDecor(g,w,d,topY+bodyH-1.3,o.dougong);
  let rt=topY+bodyH;
  if(double){
    const fr=sh(new THREE.Mesh(hipFrustumGeo(w+6,d+6,Math.max(w-18,6),Math.max(d-18,6),4.4),rm));
    fr.position.y=rt; g.add(fr);
    eaveCorners(g,w+6,d+6,rt+.2);
    rt+=4.4;
    box(g,Math.max(w-20,5),4.5,Math.max(d-20,5), 0,rt+2.27,0, bm);
    rt+=4.5;
  }
  if(pyr){
    const rw2=w+(o.double?0:8), rd2=d+(o.double?0:8);
    const p=sh(new THREE.Mesh(pyramidGeo(rw2,rd2,roofH),rm));
    p.position.y=rt; g.add(p); edged(p);
    eaveCorners(g,rw2,rd2,rt+.2);
    const fin=new THREE.Mesh(new THREE.SphereGeometry(1.7,16,12),matGoldDark);
    fin.position.y=rt+roofH+1.2; g.add(fin);
  }else{
    const rw=w+(double?-12:8), rd=d+(double?-12:8);

function ridgeZ(x){ return 240*Math.sin(x*.0016)+130*Math.sin(x*.0007*2.3+1.4); }
function ridgeH(x){ return 95+55*Math.sin(x*.0011+.5)+22*Math.sin(x*.0046+2.); }
function terrainH(x,z){

  h+=42*Math.exp(-((z-ridgeZ(x)+330)**2)/(2*130*130))*Math.max(0,Math.sin(x*.003+1.2));
  h+=36*Math.exp(-((z-ridgeZ(x)-360)**2)/(2*120*120))*Math.max(0,Math.sin(x*.0026+4.2));
  h+=24*Math.sin(x*.021+z*.017)+13*Math.sin(x*.043-z*.031)+6*Math.sin(x*.09+z*.07);
  return h;
}

const poiLayer=document.getElementById('pois');

function buildMarkers(){
  poiLayer.innerHTML=''; poiEls=[];

    el.innerHTML=`<span class="poi-dot"></span><span class="poi-tag">${p.name}</span>`;
    el.addEventListener('click',()=>openPOI(i));
    poiLayer.appendChild(el);
    p.v3=new THREE.Vector3(...p.pos);
    poiEls.push(el);
  });
}
function openPOI(i){
  activePOI=i; const p=WORLDS[activeWorld].pois[i];
  document.getElementById('c-name').textContent=p.name;
  document.getElementById('c-en').textContent=p.en;
  document.getElementById('c-year').textContent=p.year;
  document.getElementById('c-desc').textContent=p.desc;
  document.getElementById('c-geo').textContent=WORLDS[activeWorld].geo;
  const ib=document.getElementById('c-inner');
  if(p.inner){ ib.style.display=''; ib.onclick=()=>{ poiLayer.classList.add('dim'); flyTo(p.inner.p,p.inner.t,2200); }; }
  else ib.style.display='none';
  card.classList.add('show');
  poiEls.forEach((e,j)=>e.classList.toggle('active',j===i));
  flyTo(p.view.p,p.view.t,1900);
}
function closeCard(){ activePOI=-1; card.classList.remove('show');
  poiEls.forEach(e=>e.classList.remove('active')); }

function tourSet(v,silent=false){
  tourOn=v;
  if(!silent) document.querySelector('[data-toggle="tour"]').classList.toggle('on',v);
  if(v){
    poiLayer.classList.remove('dim');
    tourPending=true; tourT=0; tourDir=1;

const state={scan:true,xray:false,labels:true,rotate:false,shadow:true};
function toggleState(k){
  if(k==='tour'){ tourSet(!tourOn); return; }
  state[k]=!state[k];
  document.querySelector(`[data-toggle="${k}"]`).classList.toggle('on',state[k]);
  if(k==='xray') setXray(state.xray);
  if(k==='labels') poiLayer.style.display=state.labels?'':'none';
  if(k==='rotate') controls.autoRotate=state.rotate;
  if(k==='shadow'){
    renderer.shadowMap.enabled=state.shadow;
    sun.castShadow=state.shadow;
    scene.traverse(o=>{ if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true); } });
  }
}
function setXray(on){
  solidMats.forEach(m=>{ m.transparent=on; m.opacity=on?.07:1; m.depthWrite=!on; m.needsUpdate=true; });
  edgeMat.opacity=on?.95:.5;
}
renderer.domElement.addEventListener('pointerdown',()=>{
  poiLayer.classList.remove('dim');
  if(fly){ fly=null; controls.enabled=true; }
  if(tourOn) tourSet(false);
});
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>downXY=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY||Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>6) return;
  if(e.target!==renderer.domElement) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const root=WORLDS[activeWorld].group;
  const hits=raycaster.intersectObjects(root.children,true);
  for(const h of hits){
    let o=h.object;
    while(o&&o.userData.world!==activeWorld&&o!==root) o=o.parent;
    if(o&&o.userData.world===activeWorld&&o.userData.poi!==undefined){ openPOI(o.userData.poi); return; }
    if(h.object.visible) break;
  }
  closeCard();
});
addEventListener('keydown',e=>{
  const views=WORLDS[activeWorld].views, keys=Object.keys(views);
  const n=parseInt(e.key);
  if(n>=1&&n<=keys.length){ const v=views[keys[n-1]]; flyTo(v.p,v.t,1900); }
  else if(e.code==='Space'){ e.preventDefault(); tourSet(!tourOn); }
  else if(e.key==='x'||e.key==='X') toggleState('xray');
  else if(e.key==='l'||e.key==='L') toggleState('labels');
  else if(e.key==='r'||e.key==='R') toggleState('rotate');
});

/* ═══════════ 主循环 ═══════════ */
const clock=new THREE.Clock();
let growing=false, growT=0;
let frames=0, fpsT=0;
const stFps=document.getElementById('st-fps'), stTri=document.getElementById('st-tri'),
      stCall=document.getElementById('st-call'), stCam=document.getElementById('st-cam');
const tmpV=new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;

  if(growing){
    growT+=dt/1.5;
    const k=Math.min(growT,1), e=1-Math.pow(1-k,3);
    city.scale.y=Math.max(e,.001);
    if(k>=1) growing=false;
  }
  if(fly){
    const k=Math.min((performance.now()-fly.st)/fly.dur,1);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e);
    controls.target.lerpVectors(fly.t0,fly.t1,e);
    lastLook.copy(controls.target);
    if(k>=1){ const cb=fly.onDone; fly=null; controls.enabled=true; if(cb)cb(); }
  }
  if(tourOn&&tourPending===false){
    tourT+=dt/60*tourDir;
    if(tourT>=1){tourT=1;tourDir=-1;} if(tourT<=0){tourT=0;tourDir=1;}
    const tc=tourCurves[activeWorld], tl=tourLooks[activeWorld];
    camera.position.copy(tc.getPointAt(tourT));
    lastLook.copy(tl.getPointAt(tourT));
    camera.lookAt(lastLook);
  }
  // 扫描特效
  if(state.scan&&fx.slab.visible){
    const range=activeWorld==='wall'?270:130;
    const sy=((t*.16)%1)*range;
    fx.slab.position.y=sy;
    fx.slab.material.opacity=.028+.02*Math.sin(t*2.2);
  }
  fx.rings.forEach(r=>r.visible=state.scan);
  if(state.scan){
    fx.rings.forEach((r,i)=>{
      const s=((t*.25+i*.5)%1);
      const sc=60+s*(activeWorld==='wall'?900:470); r.scale.set(sc,sc,1);
      r.material.opacity=(1-s)*.32;
    });
  }
  if(fx.axis1&&activeWorld==='gugong'){
    fx.axis1.material.opacity=.1+.05*Math.sin(t*1.6);
    fx.axis2.material.opacity=.22+.1*Math.sin(t*1.6);
  }
  // 烽火台狼烟火光
  GW.beacons.forEach((b,i)=>{
    const f=.85+.3*Math.sin(t*7+i*2)+.12*Math.sin(t*23+i);
    b.glow.scale.setScalar(f);
    b.glow.position.y=b.y0+Math.sin(t*3+i)*0.4;
    b.li.intensity=1.8+f*.8;
  });

  controls.update();

  for(let i=0;i<poiEls.length;i++){
    tmpV.copy(WORLDS[activeWorld].pois[i].v3).project(camera);
    const el=poiEls[i];
    if(tmpV.z>1||Math.abs(tmpV.x)>1.15||Math.abs(tmpV.y)>1.15){ el.classList.add('hidden'); continue; }
    el.classList.remove('hidden');
    // 距离淡出：远处标注渐隐，避免堆叠杂乱
    const dist=camera.position.distanceTo(WORLDS[activeWorld].pois[i].v3);
    const op=dist<300?1:Math.max(1-(dist-300)/420,.12);
    el.style.opacity=op.toFixed(2);
    el.style.left=((tmpV.x*.5+.5)*innerWidth)+'px';
    el.style.top =((-tmpV.y*.5+.5)*innerHeight)+'px';
  }

  composer.render();

  frames++; fpsT+=dt;
  if(fpsT>=.5){
    stFps.textContent=Math.round(frames/fpsT);
    stTri.textContent=renderer.info.render.triangles.toLocaleString();
    stCall.textContent=renderer.info.render.calls;
    stCam.textContent=`X ${camera.position.x.toFixed(0)} · Y ${camera.position.y.toFixed(0)} · Z ${camera.position.z.toFixed(0)}`;
    frames=0; fpsT=0;
  }
  renderer.info.reset();
}
animate();
window.__APP_READY__=true;

/* ═══════════ 入场 ═══════════ */
buildMarkers(); rebuildViewButtons();
{
  const fillEl=document.getElementById('ld-fill'), msg=document.getElementById('ld-msg');
  let p=0;
  const iv=setInterval(()=>{ p=Math.min(p+8+Math.random()*14,88); fillEl.style.width=p+'%'; },160);
  setTimeout(()=>{
    clearInterval(iv); fillEl.style.width='100%'; msg.textContent='构建完成 · 数字遗产已就绪';
    setTimeout(()=>{
      document.getElementById('loader').classList.add('done');
      growing=true;
      const v=WORLDS.gugong.views['全景']; flyTo(v.p,v.t,3400);
    },500);
  },1100);
}
</script>
